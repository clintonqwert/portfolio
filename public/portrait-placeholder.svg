    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#8b959c" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="800" fill="url(#g)"/>
  <g fill="none" stroke="#8b959c" stroke-opacity=".55" stroke-width="2.5">
    <circle cx="320" cy="300" r="94"/>
    <path d="M152 688c0-101 75-172 168-172s168 71 168 172"/>
  </g>
</svg>
