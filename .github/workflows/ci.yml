name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build fails without this (see src/lib/seo.ts). CI only needs a
  # well-formed origin; the real one is set in Vercel.
  NEXT_PUBLIC_SITE_URL: https://clintonramonida.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Retired claims
        run: npm run check:claims

      - name: Contrast (WCAG AA)
        run: npm run check:contrast

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fit and behaviour, against the build just made. check-overflow proves
      # nothing spills or is silently clipped at seven viewports; check-behaviour
      # proves the deck stays one viewport and the secondary pages' cue, chapter
      # bar, ids, focus and reduced motion still do what they promise. The
      # server is stopped afterwards so Lighthouse can start its own on :3000.
      - name: Fit and behaviour
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          ./node_modules/.bin/next start -p 3000 > /tmp/next.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          npm run check:overflow -- http://127.0.0.1:3000
          npm run check:behaviour -- http://127.0.0.1:3000

      - name: Lighthouse budgets
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun

      # The same budgets on a phone: Lighthouse's default mobile emulation
      # (slow 4G, 4x CPU). Every run was desktop until #9, and three
      # accessibility failures sat at 96 until a mobile run was done by hand.
      # Floors sit a step under what #9 measured — / at 88–91 and LCP
      # 3.5–3.9s, the case studies at 95–96 and 2.7–2.9s — so they catch a
      # slide without failing on runner noise. Raise them as the numbers do.
      - name: Lighthouse budgets (mobile)
        run: lhci autorun --config=lighthouserc.mobile.json
